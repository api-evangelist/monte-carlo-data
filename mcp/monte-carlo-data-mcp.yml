generated: '2026-08-29'
method: searched
status: published
source: >-
  https://docs.getmontecarlo.com/docs/mcp-server,
  https://docs.getmontecarlo.com/docs/mcp-server-reference-and-operations,
  https://docs.getmontecarlo.com/docs/monte-carlo-mcp-server-technical-overview
provider: Monte Carlo
providerId: monte-carlo-data
name: Monte Carlo MCP Server
description: >-
  A first-party, fully hosted Model Context Protocol server that exposes Monte
  Carlo's data + AI observability platform to agents — alerts, monitors,
  assets, lineage, query and job performance, and AI agent traces. Runs on AWS
  Lambda behind an integration gateway that authenticates every request and
  forwards it to Monte Carlo's GraphQL API, executing under the calling user's
  identity so existing RBAC applies. Stateless: no customer data is persisted
  or cached by the server.
deployment:
  mode: remote
  endpoint: https://mcp.getmontecarlo.com/mcp
  auth: oauth
  verified: probed
  probe:
    method: POST tools/list
    url: https://mcp.getmontecarlo.com/mcp
    http_status: 401
    www_authenticate: >-
      Bearer error="invalid_token", error_description="Authentication required",
      resource_metadata="https://mcp.getmontecarlo.com/.well-known/oauth-protected-resource/mcp",
      scope="offline_access"
    date: '2026-08-29'
    note: >-
      A conformant RFC 9728 challenge. The endpoint is live and reachable; the
      live tool schemas are auth-gated, so the tools[] below are the names Monte
      Carlo itself publishes in its docs and in its own open-source Agent
      Skills, NOT an introspected tools/list response. inputSchema for each tool
      requires an authenticated introspection we deliberately did not attempt.
    install_note: >-
      mode is `remote`, not `both`. Monte Carlo publishes no stdio MCP package
      of its own — the key-based path in the docs runs the THIRD-PARTY
      `npx -y mcp-remote https://mcp.getmontecarlo.com/mcp` bridge against the
      same hosted endpoint, so it is a client shim for the remote server rather
      than a Monte Carlo stdio server.
transport: streamable-http
protocol: MCP (HTTP transport, OAuth 2.1)
authentication:
  - method: oauth2.1-dynamic-client-registration
    preferred: true
    note: >-
      Clients self-register via DCR (RFC 7591) at
      https://auth.getmontecarlo.com/oauth2/register — there is no static client
      ID or secret to create. Scope offline_access. Requires an Editor role or
      above in Monte Carlo.
    authorization_server: https://auth.getmontecarlo.com
    protected_resource_metadata: https://mcp.getmontecarlo.com/.well-known/oauth-protected-resource/mcp
  - method: verified-connector
    note: >-
      Monte Carlo ships as an Anthropic-verified connector in the Claude
      Connectors Directory (https://claude.com/connectors/monte-carlo) — no keys
      to manage.
  - method: mcp-server-key
    note: >-
      Scoped MCP-server-only credentials (key id + secret) for service accounts
      and CI, sent as `Authorization: Bearer <KEY_ID>:<KEY_SECRET>` or as
      x-mcd-id / x-mcd-token headers. Standard Monte Carlo API keys do NOT work
      against the MCP server. Created via UI, `montecarlo mcp create-key`, or
      the createMcpIntegrationKey GraphQL mutation.
clients_documented:
  - Claude / Claude Desktop (verified connector)
  - Claude Code (claude mcp add --transport http monte-carlo-mcp https://mcp.getmontecarlo.com/mcp)
  - Cursor
  - VS Code
  - Snowflake Cortex Agents (CREATE EXTERNAL MCP SERVER, OAUTH_DYNAMIC_CLIENT)
toolsets:
  - name: default
    always_on: true
    description: Alerts, monitors, assets, lineage, data operations, utility tools.
  - name: extended
    header: 'x-mcd-toolset: extended'
    description: Adds use-case and dashboard-widget tools.
  - name: agent_observability
    header: 'x-mcd-toolset: agent_observability'
    description: Adds AI agent inspection tools (metadata, conversations, traces).
prompts:
  published: true
  capability: MCP prompts
  note: >-
    The server publishes curated workflow prompts over the MCP prompts
    capability; supported clients discover them on connect and surface them as
    /mcp__<server>__<prompt>.
  items:
    - name: mc-asset-health
      description: Check the current health of a table before querying it.
    - name: mc-triage
      description: Triage Monte Carlo alerts so you know where to focus.
    - name: mc-incident-response
      description: Full incident orchestration — triage through root cause to remediation.
    - name: mc-proactive-monitoring
      description: Discover coverage gaps and create monitors to close them.
tools_source: >-
  Tool names are taken verbatim from Monte Carlo's own documentation
  (docs.getmontecarlo.com/docs/mcp-server) and from the 19 Apache-2.0 Agent
  Skills the company publishes at
  https://github.com/monte-carlo-data/mc-agent-toolkit, which call these tools
  by name. Input schemas are NOT recorded because the live tools/list is
  auth-gated (401).
