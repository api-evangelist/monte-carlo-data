versioning:
  api_versioning: none
  scheme: unversioned GraphQL endpoint
  note: >-
    The GraphQL API is served from a single unversioned endpoint,
    https://api.getmontecarlo.com/graphql. There is no /v1/ path, no version
    header and no published API version policy — evolution is handled the
    GraphQL way, by additive field changes. The one versioned path segment on
    the whole surface is the REST Push Ingest API (/ingest/v1/...).
  rest_ingest: /ingest/v1/{metadata|lineage|querylogs}
release_process:
  model: continuous deployment (SaaS)
  docs: https://docs.getmontecarlo.com/docs/integration-feature-lifecycles
  phases:
    - name: private preview
      description: >-
        Invitation-only pre-release. May lack features, carries no SLA and no
        technical-support obligation; pre-GA terms apply.
    - name: public preview
      description: >-
        Widely available and generally production-ready, with full technical
        support, but may carry functional/scale limitations. Monte Carlo
        explicitly reserves the right to make BREAKING CHANGES in this phase.
    - name: general availability
      description: Available to all customers and covered by SLAs where applicable.
  note: >-
    The Push Ingest API and the GitLab, Azure DevOps and ClickHouse integrations
    are in public preview as of this pass, i.e. inside the breaking-change
    window by Monte Carlo's own definition.
