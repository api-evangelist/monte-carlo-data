aid: monte-carlo-data
name: Monte Carlo
description: >-
  Monte Carlo is the data + AI observability platform that detects, resolves and
  prevents data quality incidents across warehouses, lakes, BI tools, ETL
  orchestrators and, increasingly, AI agents. Its programmatic surface is a
  single GraphQL API at api.getmontecarlo.com/graphql that exposes everything
  the web app shows — alerts, incidents, monitors, assets, table and column
  lineage, query history and job performance — alongside a REST Push Ingest API
  at integrations.getmontecarlo.com for pushing metadata, lineage and query logs
  from sources the pull-based collectors cannot reach. Monte Carlo also runs a
  first-party hosted MCP server with 56 documented tools and OAuth 2.1 dynamic
  client registration, publishes 19 Apache-2.0 Agent Skills for coding agents,
  and ships a Python SDK (pycarlo), a CLI (montecarlodata) and an OpenTelemetry
  SDK for agent tracing. The company rebranded its web presence to montecarlo.ai
  during 2026; montecarlodata.com still resolves and serves the same content.
