note: >-
  Monte Carlo serves a real, non-trivial /.well-known surface: an RFC 9116
  security.txt with a working disclosure Policy, an RFC 9727 api-catalog
  linkset that points at the docs, the API reference and the status page, and
  the full OAuth 2.1 discovery pair behind the MCP server. Two probe results
  are deliberately recorded as misses: getmontecarlo.com answers 200 with the
  same 22KB marketing HTML for every /.well-known/* path (an SPA catch-all,
  not a document), and api.getmontecarlo.com / integrations.getmontecarlo.com
  return 403 on every path because the edge rejects unauthenticated requests
  outright.
