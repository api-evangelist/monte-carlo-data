apis:
  - aid: monte-carlo-data:monte-carlo-data
    name: Monte Carlo GraphQL API
    description: >-
      Monte Carlo's single GraphQL endpoint. Every piece of information the web
      application presents can be retrieved and mutated programmatically —
      alerts and incidents, monitors and monitors-as-code, assets, table and
      column lineage, query history, job and task performance, domains,
      authorization groups, and API/OAuth/MCP credential management. Authenticate
      with an x-mcd-id / x-mcd-token key pair or with an OAuth 2.0
      client-credentials bearer token. Introspection is auth-gated, so no SDL is
      publicly downloadable; a generated HTML reference is published at
      apidocs.getmontecarlo.com and an in-browser GraphiQL explorer at
      getmontecarlo.com/graphiql.
    humanURL: https://docs.getmontecarlo.com/docs/api
    baseURL: https://api.getmontecarlo.com/graphql
    tags:
      - AIOps
      - GraphQL
      - Data Observability
    properties:
      - type: Documentation
        url: https://docs.getmontecarlo.com/docs/api
      - type: APIReference
        url: https://apidocs.getmontecarlo.com/
      - type: GraphQL
        url: https://api.getmontecarlo.com/graphql
      - type: Authentication
        url: authentication/monte-carlo-data-authentication.yml
      - type: OAuthScopes
        url: scopes/monte-carlo-data-scopes.yml
  - aid: monte-carlo-data:push-ingest-api
    name: Monte Carlo Push Ingest API
    description: >-
      A REST write API for pushing observability data into Monte Carlo from
      sources its pull-based collectors cannot reach. Three endpoints —
      POST /ingest/v1/metadata (table and view schema, columns, row and byte
      counts, freshness), POST /ingest/v1/lineage (table- and column-level
      lineage) and POST /ingest/v1/querylogs (SQL query history) — each
      returning 202 Accepted with an invocation_id. Requires a dedicated
      Ingestion-scoped integration key; standard API keys are rejected. Public
      preview, Enterprise plan or higher.
    humanURL: https://docs.getmontecarlo.com/docs/push-ingest-api
    baseURL: https://integrations.getmontecarlo.com
    tags:
      - Data Observability
      - Data Lineage
      - Ingest
    properties:
      - type: Documentation
        url: https://docs.getmontecarlo.com/docs/push-ingest-api
      - type: ErrorCatalog
        url: errors/monte-carlo-data-problem-types.yml
  - aid: monte-carlo-data:mcp-server
    name: Monte Carlo MCP Server
    description: >-
      A first-party, fully hosted Model Context Protocol server that gives AI
      agents direct access to Monte Carlo — investigating alerts, exploring
      assets and lineage, creating and tuning monitors, and evaluating AI agent
      performance. 56 documented tools across three toolsets (default, extended,
      agent_observability) plus four published MCP prompts. Reached over
      streamable HTTP with OAuth 2.1 and dynamic client registration, or with
      MCP-scoped keys; also shipped as an Anthropic-verified connector in the
      Claude Connectors Directory. Runs on AWS Lambda, stateless, executing
      under the calling user's Monte Carlo identity.
    humanURL: https://docs.getmontecarlo.com/docs/mcp-server
    baseURL: https://mcp.getmontecarlo.com/mcp
    tags:
      - MCP
      - Agent Observability
      - AIOps
    tags_raw:
      - Model Context Protocol
      - Agent Observability
      - AIOps
    properties:
      - type: MCPServer
        url: mcp/monte-carlo-data-mcp.yml
      - type: ToolCrosswalk
        url: mcp/monte-carlo-data-tool-crosswalk.yml
      - type: Documentation
        url: https://docs.getmontecarlo.com/docs/mcp-server
