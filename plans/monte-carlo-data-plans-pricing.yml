specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Monte Carlo
providerId: monte-carlo-data
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: >-
  https://www.montecarlodata.com/pricing (HTTP 200, 301s to
  https://montecarlo.ai/request-for-pricing/), plus
  https://docs.getmontecarlo.com/docs/push-ingest-api and
  https://docs.getmontecarlo.com/changelog/automatic-triage-is-now-enabled-for-all-accounts
docs: https://montecarlo.ai/request-for-pricing/
tags:
  - AIOps
  - Data Observability
description: >-
  Monte Carlo publishes NO priced plans. The pricing URL resolves to a
  "request for pricing" contact form — every tier is quoted by sales. This file
  replaces a 2026-05-04 bulk-sweep scaffold that invented free/pro/enterprise
  tiers with request quotas and per-minute rate limits; none of those numbers
  came from Monte Carlo and all have been removed.
plan_count: 0
pricing_model: enterprise-quoted
public_pricing: false
self_serve_signup: false
free_tier: false
trial: not published
plans: []
named_tiers:
  - name: Enterprise
    evidence: >-
      The Push Ingest API docs state "This feature requires an Enterprise or
      higher plan to use", so at least one tier named Enterprise exists and at
      least one tier sits above it. No price, quota or entitlement is published
      for either.
    source: https://docs.getmontecarlo.com/docs/push-ingest-api
    price: not published
usage_based_charges:
  - item: Automatic Triage (triage agent runs)
    model: usage-based
    free_allowance: first 20 triaged alerts per account per month
    effective: '2026-09-01'
    price: not published
    controls: >-
      Per-account usage restriction (unrestricted, off, or a custom monthly cap)
      with per-domain overrides, at Settings -> AI Agents.
    source: https://docs.getmontecarlo.com/changelog/automatic-triage-is-now-enabled-for-all-accounts
note: >-
  The only quantitative commercial fact Monte Carlo publishes is the 20
  free triaged alerts per account per month from 2026-09-01. Everything else —
  seat counts, table counts, monitor counts, API call allowances — is quoted.
  An honest plan_count of 0 is the finding here, not a gap in this pass.
evidence:
  - url: https://www.montecarlodata.com/pricing
    status: 200
    resolved_to: https://montecarlo.ai/request-for-pricing/
