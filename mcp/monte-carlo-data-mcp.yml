network_access_control:
  supported: true
  docs: https://docs.getmontecarlo.com/docs/network-access-control
  note: >-
    IP/CIDR allowlists can be scoped to the MCP surface specifically (scopes
    cover MCP, API, Ingestion, UI, Agent and OpenTelemetry).
security:
  token_passthrough: false
  note: >-
    Monte Carlo states the MCP server never reuses customer tokens directly,
    avoiding the MCP token-passthrough anti-pattern; calls execute under the
    authenticated user's identity in the GraphQL API. TLS 1.2+ in transit;
    stateless, no caching of customer data.
  docs: https://docs.getmontecarlo.com/docs/ai-security
