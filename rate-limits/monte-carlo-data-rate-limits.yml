specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Monte Carlo
providerId: monte-carlo-data
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: >-
  https://docs.getmontecarlo.com/docs/push-ingest-api (error codes + best
  practices), https://docs.getmontecarlo.com/docs/troubleshooting-and-faqs-api,
  https://docs.getmontecarlo.com/docs/sso-recovery-codes
docs: https://docs.getmontecarlo.com/docs/push-ingest-api
tags:
  - AIOps
  - Data Observability
  - Rate Limiting
  - Quotas
description: >-
  Monte Carlo publishes NO request-rate limits and NO rate-limit response
  headers for any of its surfaces. What it does publish are payload, batch and
  cadence ceilings on the Push Ingest API, and those are recorded here. This
  file replaces a 2026-05-04 bulk-sweep scaffold that asserted X-RateLimit-*
  headers and free/pro/enterprise per-minute quotas — none of which Monte Carlo
  documents.
headers:
  published: false
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After contract is documented. An
    agent has no runtime signal to back off on; the only documented backoff
    guidance is "retry with exponential backoff" on 5xx.
responseCodes:
  throttled: null
  payloadTooLarge: 413
  serverError: 5xx
limit_count: 0
limits: []
published_ceilings:
  - surface: Push Ingest API
    endpoint: POST /ingest/v1/{metadata,lineage,querylogs}
    kind: payload-size
    limit: 1 MB compressed request body
    exceeded_status: 413
    remediation: Split into smaller batches.
  - surface: Push Ingest API
    kind: batch-size
    limit: ~500 events per request (recommended)
    note: Guidance, not an enforced ceiling; smaller batches also isolate failures per invocation_id.
  - surface: Push Ingest API
    kind: cadence
    limit: push freshness and volume once per hour
    rationale: >-
      Monte Carlo's training pipeline aggregates into hourly buckets;
      sub-hourly pushes do not improve coverage and may produce unpredictable
      detector behavior.
  - surface: GraphQL API
    operation: deletePushIngestedTables
    kind: batch-size
    limit: 1,000 MCONs per call
  - surface: Sign-in / SSO recovery-code redeem endpoint
    kind: rate-limit
    limit: rate-limited (value not published)
    note: >-
      Named as a guardrail on the SSO recovery-code redeem endpoint, alongside
      an optional per-account IP allowlist. No number is given.
network_controls:
  ip_allowlisting: true
  scopes:
    - MCP
    - API
    - Ingestion
    - UI
    - Agent
    - OpenTelemetry
  docs: https://docs.getmontecarlo.com/docs/network-access-control
  note: >-
    Monte Carlo's access ceiling is expressed as network access control and
    role-based authorization rather than as request quotas.
note: >-
  limit_count is an honest 0: no per-key, per-account or per-endpoint request
  rate limit is published anywhere in Monte Carlo's documentation. The ceilings
  that ARE published are size and cadence bounds, captured above.
